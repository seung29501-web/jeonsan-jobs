name: daily-post

on:
  schedule:
    # 알리오가 점검 등으로 죽어 있으면 한 번 놓치므로 오전 7시와 10시(KST) 두 번 돌린다.
    - cron: '0 22 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: 공고 수집 및 HTML 생성
        run: python main.py

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
